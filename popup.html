<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Hacking 助手 - 弹出窗口</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body class="bg-gray-100 flex flex-col h-full">
  <!-- 顶部导航栏 -->
  <div class="bg-gradient text-white py-4 px-6 shadow-lg">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fas fa-search text-xl"></i>
        <h1 class="text-lg font-medium">Search Hacking 助手</h1>
      </div>
    </div>
  </div>
  
  <!-- 内容区域 -->
  <div class="flex-grow p-6 flex flex-col justify-between">
    <!-- 设置项 -->
    <div>
      <div class="mb-5">
        <div class="flex items-center justify-between mb-2">
          <label class="text-gray-700 text-base font-medium">启用侧边栏</label>
          <div class="toggle-switch" id="sidebarToggle"></div>
        </div>
        <p class="text-gray-500 text-xs">开启后，在包含site:的搜索结果页面显示Hacking语法侧边栏</p>
      </div>
      
      <div class="mb-5">
        <div class="flex items-center justify-between mb-2">
          <label class="text-gray-700 text-base font-medium">Google搜索</label>
          <div class="toggle-switch" id="googleToggle"></div>
        </div>
        <p class="text-gray-500 text-xs">是否在Google搜索引擎中启用语法工具</p>
      </div>
      
      <div class="mb-5">
        <div class="flex items-center justify-between mb-2">
          <label class="text-gray-700 text-base font-medium">百度搜索</label>
          <div class="toggle-switch" id="baiduToggle"></div>
        </div>
        <p class="text-gray-500 text-xs">是否在百度搜索引擎中启用语法工具</p>
      </div>
      
      <div class="mb-5">
        <div class="flex items-center justify-between mb-2">
          <label class="text-gray-700 text-base font-medium">Bing搜索</label>
          <div class="toggle-switch" id="bingToggle"></div>
        </div>
        <p class="text-gray-500 text-xs">是否在Bing搜索引擎中启用语法工具</p>
      </div>
      
      <div class="text-center mt-6">
        <button id="openOptions" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-full shadow-md transition-all duration-300 btn-effect flex items-center mx-auto">
          <i class="fas fa-cog mr-2"></i> 打开更多设置
        </button>
      </div>
    </div>
  </div>
  
  <!-- 底部信息 -->
  <div class="py-3 px-6 text-center border-t border-gray-200 bg-gray-50 text-xs text-gray-500">
    <div class="flex items-center justify-center space-x-3">
      <a href="#" id="githubLink" target="_blank" class="text-gray-600 hover:text-blue-600 transition-colors">
        <i class="fab fa-github"></i> GitHub
      </a>  
      <span>|</span>
      <a href="#" id="feedbackLink" target="_blank" class="text-gray-600 hover:text-blue-600 transition-colors">
        <i class="fas fa-bug"></i> 反馈
      </a>
      <span>|</span>
      <div class="text-gray-600">
        <i class="fas fa-code-branch"></i> 版本 <span class="version-text">加载中...</span>
      </div>
    </div>
  </div>
  
  <script src="js/popup.js"></script>
</body>
</html>
